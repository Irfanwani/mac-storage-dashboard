[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-storage-dashboard"
dynamic = ["version"]
description = "Local, privacy-friendly macOS disk dashboard: treemap, junk detection, safe cleanup."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Mac Storage Dashboard contributors" }]
keywords = ["macos", "disk", "storage", "cleanup", "treemap", "full-disk-access"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
urls = { Homepage = "https://github.com/Irfanwani/mac-storage-dashboard", Source = "https://github.com/Irfanwani/mac-storage-dashboard" }

[project.scripts]
mac-storage-dashboard = "mac_storage_dashboard.cli:main"

[tool.setuptools]
packages = ["mac_storage_dashboard"]

[tool.setuptools.dynamic]
version = { attr = "mac_storage_dashboard.__version__" }

[tool.setuptools.package-data]
mac_storage_dashboard = ["index.html", "favicon.svg", "svg2png.js"]
